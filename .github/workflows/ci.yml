name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/wedding-live-hub-mvp-ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
