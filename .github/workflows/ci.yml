name: ci

on:
  push:
    branches:
      - feat/wedding-live-hub-mvp
  pull_request:
    branches:
      - ci/wedding-hub-checks
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
