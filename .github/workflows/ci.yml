name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/admin-rehearsal-links

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - name: Run focused PremierePlayer tests
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/premiere-yandex-disk'
        run: npm test -- src/features/premiere/PremierePlayer.test.tsx
      - name: Run unit tests
        if: github.event_name != 'pull_request' || github.head_ref != 'fix/premiere-yandex-disk'
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Vitest failure tail"
            tail -n 220 vitest.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 40 vitest.log
      - run: npm run build
